name: Release Debug APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (optional; defaults to debug-<run_number>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-debug-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER=$(find "$SDK_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Determine release version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION_NAME="${TAG#v}"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            VERSION_NAME="${TAG#v}"
          else
            TAG="debug-${{ github.run_number }}"
            VERSION_NAME="${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PfinmagicVersionCode=${{ steps.meta.outputs.version_code }} -PfinmagicVersionName=${{ steps.meta.outputs.version_name }}

      - name: Prepare APK asset
        id: apk
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          OUT_NAME="FinMagic-${TAG}-debug.apk"
          cp "${APK_PATH}" "${OUT_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${OUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinMagic-debug-apk
          path: ${{ steps.apk.outputs.apk_file }}

      - name: Create GitHub Release with Debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FinMagic ${{ steps.apk.outputs.tag }} (Debug)
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk_file }}
